name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gforth
        run: sudo apt-get update && sudo apt-get install -y gforth

      - name: Run tests
        run: make test
